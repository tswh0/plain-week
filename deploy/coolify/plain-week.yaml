# documentation: https://github.com/victor-falcon/plain-week/blob/main/docs/self-hosting.md
# slogan: A minimal, offline-first weekly planner. Free, open source and self-hostable.
# category: productivity
# tags: planner, todo, tasks, calendar, productivity, offline-first, pwa
# logo: svgs/plain-week.svg
# port: 8080

services:
    plainweek:
        image: ghcr.io/victor-falcon/plain-week:latest
        volumes:
            - plainweek-storage:/app/storage
        environment:
            - SERVICE_URL_PLAINWEEK_8080
            - APP_NAME=${APP_NAME:-Plain Week}
            - APP_ENV=production
            - APP_DEBUG=false
            - APP_URL=${SERVICE_URL_PLAINWEEK}
            - APP_KEY=base64:${SERVICE_REALBASE64_32_APPKEY}
            - APP_NOINDEX=${APP_NOINDEX:-false}
            - DB_CONNECTION=sqlite
            - LOG_CHANNEL=stderr
            - MAIL_MAILER=${MAIL_MAILER:-log}
            - MAIL_SCHEME=${MAIL_SCHEME:-}
            - MAIL_HOST=${MAIL_HOST:-}
            - MAIL_PORT=${MAIL_PORT:-587}
            - MAIL_USERNAME=${MAIL_USERNAME:-}
            - MAIL_PASSWORD=${MAIL_PASSWORD:-}
            - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-hello@example.com}
            - MAIL_FROM_NAME=${MAIL_FROM_NAME:-Plain Week}
            - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
            - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
            - CALDAV_ENABLED=${CALDAV_ENABLED:-false}
            - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
            - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
            - VAPID_SUBJECT=${VAPID_SUBJECT:-}
        healthcheck:
            test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8080/up']
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
